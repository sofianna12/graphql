<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone01 Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Login page: visible when the user is not logged in -->
  <main id="login-view" class="login-view">
    <form id="login-form" class="login-card" novalidate>
      <h1>Sign in</h1>
      <p class="muted">Use your Zone01 username or email.</p>

      <label for="identifier">Username or email</label>
      <input id="identifier" name="identifier" type="text"
             autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <p id="login-error" class="form-error" role="alert" hidden></p>

      <button id="login-button" class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Profile page: hidden until the user logs in -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1>Profile</h1>
      <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
    </header>

    <!-- The profile sections will be added here (Milestone 3) -->
    <main id="profile-content"></main>
  </div>
</body>
</html>
